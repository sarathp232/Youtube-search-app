<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Search</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --card-hover: #242424;
    --text: #f1f1f1;
    --muted: #aaaaaa;
    --accent: #ff0000;
    --accent-hover: #cc0000;
    --border: #2c2c2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  h1 {
    margin: 0;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 .logo-red { color: var(--accent); }

  .search-bar {
    display: flex;
    width: 100%;
    max-width: 600px;
    gap: 8px;
  }
  #searchInput {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput:focus {
    border-color: var(--accent);
  }
  #searchBtn {
    padding: 12px 22px;
    border-radius: 24px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  #searchBtn:hover { background: var(--accent-hover); }
  #searchBtn:disabled { background: #555; cursor: not-allowed; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  #playerSection {
    margin-bottom: 32px;
    display: none;
  }
  #playerSection.active { display: block; }
  .player-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  .player-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  #playerTitle {
    margin: 12px 0 4px;
    font-size: 1.15rem;
    font-weight: 500;
  }
  #playerChannel {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #closePlayerBtn {
    margin-top: 10px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #closePlayerBtn:hover { color: var(--text); border-color: var(--text); }

  #status {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 1rem;
  }
  #status.error { color: #ff6b6b; }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .result-card {
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    border: 1px solid var(--border);
  }
  .result-card:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
  }
  .thumb-wrapper {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  .thumb-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-info {
    padding: 10px 12px 14px;
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-channel {
    font-size: 0.82rem;
    color: var(--muted);
    margin: 0;
  }

  footer.api-key-bar {
    max-width: 600px;
    margin: 0 auto 8px;
    width: 100%;
    text-align: center;
  }
  #apiKeyToggle {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: underline;
  }
  #apiKeyRow {
    display: none;
    gap: 8px;
    margin-top: 8px;
  }
  #apiKeyRow.active { display: flex; }
  #apiKeyInput {
    flex: 1;
    padding: 8px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
  }
  #saveKeyBtn {
    padding: 8px 14px;
    border-radius: 16px;
    border: none;
    background: #333;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
  }
  #saveKeyBtn:hover { background: #444; }

  @media (max-width: 480px) {
    h1 { font-size: 1.15rem; }
    .search-bar { flex-direction: row; }
    #searchBtn { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="logo-red">▶</span> YouTube Search</h1>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search for videos..." autocomplete="off" />
    <button id="searchBtn">Search</button>
  </div>
  <footer class="api-key-bar">
    <button id="apiKeyToggle">Set YouTube API Key</button>
    <div id="apiKeyRow">
      <input type="password" id="apiKeyInput" placeholder="Paste your YouTube Data API v3 key" />
      <button id="saveKeyBtn">Save</button>
    </div>
  </footer>
</header>

<main>
  <section id="playerSection">
    <div class="player-wrapper">
      <iframe id="videoFrame"
        src=""
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <h2 id="playerTitle"></h2>
    <p id="playerChannel"></p>
    <button id="closePlayerBtn">✕ Close player</button>
  </section>

  <div id="status"></div>
  <div class="results-grid" id="results"></div>
</main>

<script>
(function () {
  const STORAGE_KEY = 'yt_data_api_key';

  const searchInput   = document.getElementById('searchInput');
  const searchBtn     = document.getElementById('searchBtn');
  const statusEl      = document.getElementById('status');
  const resultsEl     = document.getElementById('results');
  const playerSection = document.getElementById('playerSection');
  const videoFrame    = document.getElementById('videoFrame');
  const playerTitle   = document.getElementById('playerTitle');
  const playerChannel = document.getElementById('playerChannel');
  const closePlayerBtn = document.getElementById('closePlayerBtn');

  const apiKeyToggle = document.getElementById('apiKeyToggle');
  const apiKeyRow     = document.getElementById('apiKeyRow');
  const apiKeyInput   = document.getElementById('apiKeyInput');
  const saveKeyBtn    = document.getElementById('saveKeyBtn');

  // ---- API key handling (stored only in this browser's localStorage) ----
  function getApiKey() {
    return localStorage.getItem(STORAGE_KEY) || '';
  }
  function setApiKey(key) {
    localStorage.setItem(STORAGE_KEY, key.trim());
  }

  apiKeyInput.value = getApiKey();

  apiKeyToggle.addEventListener('click', () => {
    apiKeyRow.classList.toggle('active');
    if (apiKeyRow.classList.contains('active')) apiKeyInput.focus();
  });

  saveKeyBtn.addEventListener('click', () => {
    setApiKey(apiKeyInput.value);
    apiKeyRow.classList.remove('active');
    showStatus('API key saved. You can search now.', false);
    setTimeout(() => { if (resultsEl.children.length === 0) clearStatus(); }, 1800);
  });

  // ---- Status helpers ----
  function showStatus(message, isError, showSpinner) {
    statusEl.innerHTML = '';
    if (showSpinner) {
      const spin = document.createElement('div');
      spin.className = 'spinner';
      statusEl.appendChild(spin);
    }
    const p = document.createElement('div');
    p.textContent = message;
    statusEl.appendChild(p);
    statusEl.className = isError ? 'error' : '';
  }
  function clearStatus() {
    statusEl.innerHTML = '';
    statusEl.className = '';
  }

  // ---- Rendering results ----
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderResults(items) {
    resultsEl.innerHTML = '';
    items.forEach(item => {
      const videoId = item.id.videoId;
      if (!videoId) return;

      const title = item.snippet.title;
      const channel = item.snippet.channelTitle;
      const thumb = item.snippet.thumbnails.medium
        ? item.snippet.thumbnails.medium.url
        : item.snippet.thumbnails.default.url;

      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="thumb-wrapper">
          <img src="${thumb}" alt="${escapeHtml(title)}" loading="lazy" />
        </div>
        <div class="card-info">
          <p class="card-title">${escapeHtml(title)}</p>
          <p class="card-channel">${escapeHtml(channel)}</p>
        </div>
      `;
      card.addEventListener('click', () => playVideo(videoId, title, channel));
      resultsEl.appendChild(card);
    });
  }

  function playVideo(videoId, title, channel) {
    videoFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    playerTitle.textContent = title;
    playerChannel.textContent = channel;
    playerSection.classList.add('active');
    playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  closePlayerBtn.addEventListener('click', () => {
    videoFrame.src = '';
    playerSection.classList.remove('active');
  });

  // ---- Search ----
  async function performSearch() {
    const query = searchInput.value.trim();
    resultsEl.innerHTML = '';

    if (!query) {
      showStatus('Please enter a search term.', true, false);
      return;
    }

    const apiKey = getApiKey();
    if (!apiKey) {
      showStatus('Please set your YouTube Data API v3 key first (link above the search bar).', true, false);
      apiKeyRow.classList.add('active');
      apiKeyInput.focus();
      return;
    }

    searchBtn.disabled = true;
    showStatus('Searching...', false, true);

    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(query)}&key=${encodeURIComponent(apiKey)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        const message = (data.error && data.error.message) || `Request failed with status ${res.status}`;
        showStatus(`Error: ${message}`, true, false);
        return;
      }

      if (!data.items || data.items.length === 0) {
        showStatus(`No results found for "${query}".`, false, false);
        return;
      }

      clearStatus();
      renderResults(data.items);
    } catch (err) {
      showStatus('Network error: could not reach YouTube. Please check your connection and try again.', true, false);
    } finally {
      searchBtn.disabled = false;
    }
  }

  searchBtn.addEventListener('click', performSearch);
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') performSearch();
  });

  // Initial hint
  showStatus('Enter a search term above to find videos.', false, false);
})();
</script>

</body>
</html>
